<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <title>1:1 회복 나침반 — 상담 신청</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background: #f8f9fb; color: #1a1a2e; min-height: 100vh;
           display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px 80px; word-break: keep-all; }
    .card { background: #fff; border-radius: 24px; box-shadow: 0 4px 32px rgba(0,0,0,.08); width: 100%; max-width: 480px; overflow: hidden; }
    /* 1:1 은 그룹과 다른 색으로. 결제가 아니라 상담이라는 것이 색에서도 읽혀야 한다. */
    .card-header { background: linear-gradient(135deg, #a8522f 0%, #d97757 100%); padding: 32px 28px 28px; color: #fff; }
    .card-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 10px; }
    .card-title { font-size: 22px; font-weight: 800; line-height: 1.35; margin-bottom: 8px; }
    .card-sub { font-size: 13.5px; color: rgba(255,255,255,.85); line-height: 1.6; }
    .card-body { padding: 28px; }

    .back-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600;
                color: #94a3b8; text-decoration: none; margin-bottom: 20px; }

    /* 가격을 여기서 보여드린다. 상담 뒤에 처음 들으면 놀라신다. */
    .price { background: #fdf5f1; border: 1.5px solid #f0cdbb; border-radius: 16px;
             padding: 18px 20px; margin-bottom: 24px; text-align: center; }
    .price .k { font-size: 12.5px; font-weight: 800; color: #a8522f; letter-spacing: .04em; margin-bottom: 7px; }
    .price .v { font-size: 30px; font-weight: 800; color: #7c3f22; letter-spacing: -.03em; line-height: 1.15; }
    .price .v span { font-size: 15px; font-weight: 700; margin-left: 4px; }
    .price .w { margin-top: 9px; font-size: 13px; color: #8a5a41; line-height: 1.65; }

    .said { background: #f8fafc; border-left: 3px solid #d97757; border-radius: 0 10px 10px 0;
            padding: 14px 16px; margin-bottom: 24px; font-size: 13.5px; color: #475569; line-height: 1.7; }
    .said b { color: #1a1a2e; }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 7px; }
    .field .req { color: #d97757; }
    .field input { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 13px 14px;
                   font-size: 15px; font-family: inherit; outline: none; transition: border-color .2s; color: #1a1a2e; }
    .field input:focus { border-color: #d97757; }

    .agree { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 22px; cursor: pointer; }
    .agree input { width: 20px; height: 20px; margin-top: 1px; accent-color: #d97757; flex-shrink: 0; }
    .agree span { font-size: 13px; color: #475569; line-height: 1.65; }
    .agree b { color: #1a1a2e; }

    .guide { background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 14px;
             padding: 15px 17px; margin-bottom: 18px; }
    .guide p { font-size: 13.5px; color: #854d0e; line-height: 1.75; margin: 0; }
    .guide b { color: #713f12; }

    .submit { width: 100%; border: 0; border-radius: 14px; padding: 17px; font-family: inherit;
              font-size: 16.5px; font-weight: 800; color: #3b1e00; background: #fee500; cursor: pointer;
              transition: background .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .submit:hover { background: #f7dc00; }
    .submit:disabled { background: #e2e8f0; color: #b3bcc4; cursor: default; }
    .err { margin-top: 12px; font-size: 13px; color: #c1556a; font-weight: 700; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="card-eyebrow">1:1 Recovery Compass</div>
      <div class="card-title">상담 신청</div>
      <div class="card-sub">매일 기록을 회복연구소가 직접 보고 단계를 정합니다.</div>
    </div>

    <div class="card-body">
      <a class="back-btn" href="./quiz.html">← 다시 확인하기</a>

      <div class="price">
        <div class="k">1:1 회복 나침반</div>
        <div class="v">199,000<span>원 / 4주</span></div>
        <div class="w">상담 후에 시작 여부를 정하십니다.<br>안 맞으시면 그룹을 권해드립니다.</div>
      </div>

      <!-- 자가진단에서 고르신 답을 그대로 돌려드린다. 왜 1:1 인지가 여기서 읽힌다. -->
      <div class="said" id="said">방금 <b>혼자 하다 계속 막힌다</b>고 하셨습니다.</div>

      <div class="field">
        <label for="nm">성함 <span class="req">*</span></label>
        <input id="nm" type="text" placeholder="홍길동" autocomplete="name">
      </div>

      <div class="field">
        <label for="ph">연락처 <span class="req">*</span></label>
        <input id="ph" type="tel" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric">
      </div>

      <label class="agree">
        <input id="ag" type="checkbox">
        <span><b>개인정보 수집 및 이용에 동의합니다.</b><br>
          수집 항목은 성함·연락처이며, 상담 연락에만 씁니다.
          시작하지 않으시면 즉시 파기합니다.</span>
      </label>

      <div class="guide">
        <p>아래 <b>상담 신청하기</b>를 누르시면 카카오톡 채널이 열립니다.<br>
          채팅으로 <b>성함을 적어주시면</b> 상담 도와드리겠습니다.</p>
      </div>

      <button class="submit" id="go" disabled>상담 신청하기</button>
      <p class="err hidden" id="err">잠시 문제가 있었습니다. 다시 눌러주세요.</p>
    </div>
  </div>

<script>
(function(){
  var API = "https://recovery-log-production.up.railway.app";
  var KAKAO = "http://pf.kakao.com/_xmnxfyn";

  /* 자가진단에서 고르신 말을 그대로 받아 보여준다. ?say=... 로 넘어온다. */
  try {
    var say = new URLSearchParams(location.search).get("say");
    if (say) document.getElementById("said").innerHTML = "방금 <b>" + say + "</b>고 하셨습니다.";
  } catch (e) {}

  var nm = document.getElementById("nm");
  var ph = document.getElementById("ph");
  var ag = document.getElementById("ag");
  var go = document.getElementById("go");
  var err = document.getElementById("err");

  function ready(){
    go.disabled = !(nm.value.trim().length >= 2
      && ph.value.replace(/\D/g,"").length >= 10 && ag.checked);
  }
  [nm, ph].forEach(function(el){ el.addEventListener("input", ready); });
  ag.addEventListener("change", ready);

  // 번호를 적는 대로 하이픈을 넣어드린다
  ph.addEventListener("input", function(){
    var v = ph.value.replace(/\D/g, "").slice(0, 11);
    ph.value = v.length > 7 ? v.slice(0,3)+"-"+v.slice(3,7)+"-"+v.slice(7)
             : v.length > 3 ? v.slice(0,3)+"-"+v.slice(3) : v;
  });

  go.addEventListener("click", function(){
    go.disabled = true;
    go.textContent = "여는 중…";
    err.classList.add("hidden");

    /* 팝업 차단을 피하려면 창을 먼저 열어야 한다. 누른 그 순간에만 열린다.
       저장을 기다렸다가 열면 브라우저가 막는다. */
    var win = window.open(KAKAO, "_blank");

    fetch(API + "/api/apply-submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: nm.value.trim(),
        phone: ph.value.trim(),
        program: "1to1",
        source: "quiz"
      })
    })
    .then(function(r){
      // fetch 는 400 을 받아도 예외를 던지지 않는다. 직접 확인해야 조용히 사라지지 않는다.
      if (!r.ok) throw new Error(String(r.status));
      go.textContent = "상담 신청 완료 ✓";
      // 창이 막혔으면 이 탭에서라도 카톡으로 보낸다
      if (!win || win.closed) location.href = KAKAO;
    })
    .catch(function(){
      go.disabled = false;
      go.textContent = "상담 신청하기";
      err.classList.remove("hidden");
    });
  });
})();
</script>
</body>
</html>
